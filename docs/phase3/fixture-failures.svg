<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc"><title id="title">Deliberate fixture failures</title><desc id="desc">Baseline has ten failures in each of three categories. Corrected fixture has zero. Other eight categories have zero. No provider performance measured.</desc><rect width="900" height="350" fill="#f6f8fc"/><g font-family="sans-serif" fill="#22384c"><text x="28" y="38" font-size="23">Fixture failures, not agent reliability</text><text x="28" y="65" font-size="14">110 synthetic cases · deliberate baseline defects · corrected fixture: 0 failures</text><text x="28" y="125" font-size="15">Tool error</text><rect x="230" y="110" width="420" height="24" rx="3" fill="#a34a50"/><text x="660" y="127" font-size="14">10</text><text x="28" y="178" font-size="15">Malformed response</text><rect x="230" y="163" width="420" height="24" rx="3" fill="#a34a50"/><text x="660" y="180" font-size="14">10</text><text x="28" y="231" font-size="15">Knowledge conflict</text><rect x="230" y="216" width="420" height="24" rx="3" fill="#a34a50"/><text x="660" y="233" font-size="14">10</text><text x="28" y="284" font-size="15">Other 8 categories</text><rect x="230" y="269" width="0" height="24" rx="3" fill="#a34a50"/><text x="240" y="286" font-size="14">0</text></g></svg>