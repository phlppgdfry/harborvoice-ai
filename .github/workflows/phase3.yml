name: Phase 3 offline verification
on:
  push:
    branches: [main, integration/pre-phase4-audit]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:phase3:check
      - run: npm run phase3:verify
      - run: npx playwright install --with-deps chromium
      - name: AgentProof browser verification
        run: |
          npm run preview --prefix apps/agentproof > /tmp/agentproof.log 2>&1 &
          trap 'kill $!' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:4313/
          npm run phase3:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phase3-evidence
          path: |
            docs/phase3/browser-verification.json
            docs/phase3/screenshots/
